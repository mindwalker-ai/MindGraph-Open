[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
# ADR-015: server components are AGPL-3.0 (proposed, pending legal approval).
# Crates with a different license (e.g. mindgraph-mcp) override this field.
license = "AGPL-3.0-only"
repository = "https://github.com/mindwalker-ai/MindGraph-Open"
publish = false

[workspace.dependencies]
# Internal crates
mindgraph-domain = { path = "crates/mindgraph-domain" }
mindgraph-core = { path = "crates/mindgraph-core" }

# Domain
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v7", "serde"] }

# Runtime / HTTP (never used by mindgraph-domain)
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
