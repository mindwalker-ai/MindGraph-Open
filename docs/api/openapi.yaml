openapi: 3.1.0
info:
  title: MindGraph Open API
  version: 0.1.0
  description: |
    Public HTTP API of `mindgraph-core` (ADR-006).

    Every response has an `x-request-id` header. A client may send its own
    (1–128 visible ASCII characters); otherwise one is generated. Every error
    uses the same envelope, whose `request_id` matches the header.

    The AI Graph Builder (M5) is optional. It *suggests* an ontology and an
    M4 mapping for an analysed data source; MindGraph validates the
    suggestion, the user reviews it, and the reviewed result is submitted
    with the ordinary ontology and ingestion endpoints. The AI never writes
    graph data, ontologies or mappings.

    The Graph Explorer (M6) reads graphs through five read-only endpoints:
    exact entity search, one entity, a bounded neighbourhood, a bounded
    shortest path and the subgraph among given entities. Every read is
    scoped to one graph and bounded; there is no endpoint that returns a
    whole graph, no full-text search and no graph-wide statistics.

    GraphRAG (M7, optional) answers a question about one graph from bounded
    graph evidence: MindGraph Core retrieves real entities, relationships
    and paths through the GraphStore, the configured model phrases an answer
    that cites them (`E1`, `R1`, `P1`), and Core keeps only citations of
    retrieved evidence. The request takes a question and a scope, never a
    query language, and nothing is ever written to the graph. Missing
    evidence is a `200` with `status: insufficient_evidence`.

    Dataset ingestion (M4) is deterministic and needs no AI service:
    define an ontology, upload a CSV or JSON file, analyse it (an
    asynchronous job), then submit a mapping (another job). Jobs are
    followed with `GET /api/v1/jobs/{job_id}` or its Server-Sent Events.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: http://localhost:8080
    description: Local Docker Compose stack
tags:
  - name: operations
  - name: graphs
  - name: datasets
    description: Upload, analysis and ingestion of CSV / flat JSON files (M4).
  - name: graph-builder
    description: AI Graph Builder suggestions (M5, optional).
  - name: jobs
    description: Background analysis, ingestion and AI suggestion jobs.
  - name: explorer
    description: Read-only, bounded graph exploration (M6).
  - name: graphrag
    description: Ask MindGraph, graph-first question answering with evidence (M7, optional).
paths:
  /health:
    get:
      tags: [operations]
      operationId: getHealth
      summary: Liveness check (no database access)
      responses:
        "200":
          description: The process is serving requests.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /ready:
    get:
      tags: [operations]
      operationId: getReadiness
      summary: Readiness check (PostgreSQL reachable)
      description: |
        Checks PostgreSQL. HugeGraph is checked once at startup (the server
        does not start without it) but not by this endpoint in v0.1.
      responses:
        "200":
          description: Required infrastructure is reachable.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ready }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/graphs:
    post:
      tags: [graphs]
      operationId: createGraph
      summary: Create a graph project with an empty ontology v1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGraphRequest" }
            example:
              name: Fraud Investigation
              description: Transaction investigation graph
      responses:
        "201":
          description: The graph project was created.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Location:
              description: URL of the new graph project.
              schema: { type: string, example: /api/v1/graphs/0190f0c1-7a2b-7c3d-8e4f-5a6b7c8d9e0f }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Graph" }
        "400": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    get:
      tags: [graphs]
      operationId: listGraphs
      summary: List graph projects, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Graph projects ordered by `created_at` descending, then id.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphList" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/graphs/{graph_id}:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    get:
      tags: [graphs]
      operationId: getGraph
      summary: Read a graph project
      responses:
        "200":
          description: The graph project.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Graph" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/graphs/{graph_id}/ontology:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    get:
      tags: [graphs]
      operationId: getActiveOntology
      summary: Read the active ontology of a graph project
      responses:
        "200":
          description: The active ontology version.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ontology" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [graphs]
      operationId: createOntologyVersion
      summary: Create the next ontology version and make it active
      description: |
        The body is the complete set of types of the new version (not a
        patch). Type ids are generated by the server. Creation and activation
        are atomic. Earlier versions stay readable; running ingestion jobs keep
        the version they were validated against.

        Send `expected_version` (the active version the body was built from,
        for example an AI suggestion's `ontology_version_base`) so a stale
        body cannot replace types added by someone else in the meantime: if
        another version is active, the request fails with `409 CONFLICT` and
        nothing is written. The check is atomic.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOntologyRequest" }
            example:
              expected_version: 1
              entity_types:
                - name: Customer
                  display_name: Customer
                  properties:
                    - { name: customer_id, type: string, required: true }
                    - { name: name, type: string, required: false }
              relationship_types: []
      responses:
        "201":
          description: The new, active ontology version.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ontology" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/graphs/{graph_id}/data-sources:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [datasets]
      operationId: uploadDataSource
      summary: Upload a CSV or JSON file (multipart/form-data, field `file`)
      description: |
        The kind comes from the filename extension (`.csv` or `.json`, any
        case); the browser MIME type is ignored. The content is only checked
        by the analysis job. The file is streamed to storage under the data
        source id, never under its filename, which is kept as metadata. Other
        form fields are ignored.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The dataset, at most `MINDGRAPH_MAX_UPLOAD_BYTES` (default 50 MiB).
      responses:
        "201":
          description: The data source, `pending` until analysed.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Location:
              description: URL of the data source.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataSource" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/graphs/{graph_id}/data-sources/{data_source_id}:
    parameters:
      - $ref: "#/components/parameters/GraphId"
      - $ref: "#/components/parameters/DataSourceId"
    get:
      tags: [datasets]
      operationId: getDataSource
      summary: Read a data source, with its profile once analysed
      description: A data source of another graph is `404 DATA_SOURCE_NOT_FOUND`.
      responses:
        "200":
          description: The data source.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataSource" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/graphs/{graph_id}/data-sources/{data_source_id}/analyze:
    parameters:
      - $ref: "#/components/parameters/GraphId"
      - $ref: "#/components/parameters/DataSourceId"
    post:
      tags: [datasets]
      operationId: analyzeDataSource
      summary: Start an analysis job (type inference and bounded samples)
      description: |
        On success the data source becomes `ready` with a profile; on failure
        it becomes `failed` (the file is kept) and the job reports the reason.
      responses:
        "202":
          description: The analysis job was queued.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Location:
              description: URL of the job.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/graphs/{graph_id}/data-sources/{data_source_id}/ingestions:
    parameters:
      - $ref: "#/components/parameters/GraphId"
      - $ref: "#/components/parameters/DataSourceId"
    post:
      tags: [datasets]
      operationId: startIngestion
      summary: Start an ingestion job for an analysed data source
      description: |
        The mapping is validated against the active ontology before the job
        is created, and that ontology version is pinned on the job. The same
        `Idempotency-Key` (per graph) returns the original job instead of
        ingesting again, also after a restart; reusing it with a different
        data source or mapping is `409 CONFLICT`. On success the graph moves
        from `draft` to `active`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 1–255 visible ASCII characters chosen by the client, e.g. a UUID.
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestionRequest" }
      responses:
        "202":
          description: The ingestion job (new, or the original one for a repeated key).
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Location:
              description: URL of the job.
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Job" }
                  - type: object
                    required: [job_id]
                    properties:
                      job_id: { type: string, format: uuid, description: Same as `id` (ADR-006). }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/graphs/{graph_id}/graph-builder/suggestions:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [graph-builder]
      operationId: requestGraphSuggestion
      summary: Ask the AI Graph Builder to model several data sources together
      description: |
        Starts one `ai_suggest` job for 1–10 distinct analysed (`ready`) data
        sources of the graph, pinned to the graph's active ontology version.
        The AI proposes one ontology for all of them (the same real-world
        thing gets one entity type across files) and one mapping per data
        source, with cross-file relationships placed in the data source whose
        records hold both identifiers.

        The AI receives, per data source, its profile (field names, inferred
        types, nullability, non-null counts, up to 5 sample values per field
        and up to 10 sample rows) and its filename as a label, plus the
        active ontology. Never the files, other records or graph contents.

        The result is a validated draft: apply the reviewed ontology with
        `POST .../ontology` (with `expected_version`), then each mapping, in
        the returned order, with `POST .../data-sources/{data_source_id}/ingestions`.

        The same `Idempotency-Key` (per graph) with the same data sources in
        the same order returns the original job without another provider
        call; anything else with that key is `409 CONFLICT`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 1–255 visible ASCII characters chosen by the client, e.g. a UUID.
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuggestionRequest" }
            example:
              data_source_ids:
                - 019a0000-0000-7000-8000-000000000001
                - 019a0000-0000-7000-8000-000000000002
      responses:
        "202":
          description: The suggestion job was queued (or the original job for a repeated key).
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Location:
              description: URL of the job.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        "400":
          description: |
            `MISSING_IDEMPOTENCY_KEY`, `INVALID_DATA_SOURCE_ID`, `INVALID_JSON`,
            or `INVALID_REQUEST` (no data sources, more than 10, or duplicates).
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/graphs/{graph_id}/data-sources/{data_source_id}/graph-builder/suggestions:
    parameters:
      - $ref: "#/components/parameters/GraphId"
      - $ref: "#/components/parameters/DataSourceId"
    post:
      tags: [graph-builder]
      operationId: requestGraphBuilderSuggestion
      summary: Ask the AI Graph Builder for a suggestion for one data source
      description: |
        Shorthand for `POST /api/v1/graphs/{graph_id}/graph-builder/suggestions`
        with `{"data_source_ids": [data_source_id]}`.

        Starts an `ai_suggest` job for an analysed (`ready`) data source,
        pinned to the graph's active ontology version. The AI receives only
        the dataset profile (field names, inferred types, nullability,
        non-null counts, up to 5 sample values per field and up to 10 sample
        rows), its filename as a label, and the active ontology. Never the
        file, other records or graph contents.

        The result (read with `GET /api/v1/jobs/{job_id}`) is a suggestion that
        passed MindGraph's own validation: existing types kept, the mapping
        valid against the dataset. It is a draft. Nothing is stored in the
        ontology or the graph until the reviewed ontology and mapping are
        submitted with `POST .../ontology` and `POST .../ingestions`.

        Provider calls can cost money: the same `Idempotency-Key` (per graph)
        returns the original job without another provider call; reusing it
        for another data source or job kind is `409 CONFLICT`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 1–255 visible ASCII characters chosen by the client, e.g. a UUID.
          schema: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "202":
          description: The suggestion job was queued (or the original job for a repeated key).
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            Location:
              description: URL of the job.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503":
          description: |
            `AI_NOT_CONFIGURED` (no provider configured; build the ontology and
            mapping manually), `AI_UNAVAILABLE` (the AI service cannot be
            reached) or `SERVICE_UNAVAILABLE`.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  code: AI_NOT_CONFIGURED
                  message: The AI Graph Builder is not configured; build the ontology and mapping manually
                  request_id: 0190f0c1-7a2b-7c3d-8e4f-5a6b7c8d9e0f
  /api/v1/graphs/{graph_id}/entities/search:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [explorer]
      operationId: searchEntities
      summary: Find entities by type and exact property values
      description: |
        Exact matching only (no full-text, fuzzy or semantic search). Filter
        values are typed with the active ontology: give `entity_type`, or use
        properties whose type is the same in every entity type. Integers may
        be sent as decimal strings. Results are ordered by id and capped at
        `limit`, so `count` is the number returned, not a total.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntitySearchRequest" }
            example:
              entity_type: Customer
              property_filters: { customer_id: C001 }
              limit: 25
      responses:
        "200":
          description: The matching entities.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntitySearchResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/graphs/{graph_id}/entities/{entity_id}:
    parameters:
      - $ref: "#/components/parameters/GraphId"
      - $ref: "#/components/parameters/EntityId"
    get:
      tags: [explorer]
      operationId: getEntity
      summary: Read one entity
      description: An entity of another graph is `404 ENTITY_NOT_FOUND`.
      responses:
        "200":
          description: The entity.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entity" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/graphs/{graph_id}/entities/{entity_id}/neighbors:
    parameters:
      - $ref: "#/components/parameters/GraphId"
      - $ref: "#/components/parameters/EntityId"
    get:
      tags: [explorer]
      operationId: getNeighbors
      summary: Expand an entity's neighbourhood
      description: |
        The entity itself, its matching relationships (at most `limit`,
        smallest ids first) and the entities at their other ends. When as
        many relationships as `limit` come back, the entity may have more.
      parameters:
        - name: direction
          in: query
          description: Relationships leaving the entity, reaching it, or both.
          schema: { type: string, enum: [outgoing, incoming, both], default: both }
        - name: relationship_type
          in: query
          description: Only relationships of this type.
          schema: { type: string }
        - name: limit
          in: query
          description: At most this many relationships.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: The neighbourhood.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subgraph" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/graphs/{graph_id}/paths:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [explorer]
      operationId: findPath
      summary: Find a shortest path between two entities
      description: |
        A path with the fewest hops, computed by the graph store, of at most
        `max_depth` hops. `found: false` only means there is none within that
        depth and direction. A path from an entity to itself has zero hops.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PathRequest" }
      responses:
        "200":
          description: The path, or `found` false.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphPath" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/graphs/{graph_id}/subgraph:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [explorer]
      operationId: getSubgraph
      summary: Read given entities and the relationships among them
      description: |
        Returns the named entities that exist in the graph, plus every
        relationship whose two ends are both among them. Missing and repeated
        ids are ignored; no other entities are added.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubgraphRequest" }
      responses:
        "200":
          description: The subgraph.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subgraph" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/graphs/{graph_id}/ask:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [graphrag]
      operationId: askGraph
      summary: Answer a question from bounded graph evidence
      description: |
        Synchronous and bounded: the model interprets the question into one
        of four operations (`entity_lookup`, `neighbors`, `find_path`,
        `shared_neighbor`), MindGraph validates that plan against the
        ontology and limits, retrieves evidence from the GraphStore (at most
        100 graph operations, 150 entities, 300 relationships, 48 KiB of
        model context), and the model phrases an answer from that evidence.
        Citations that do not refer to the evidence are removed. The whole
        question must finish within `MINDGRAPH_GRAPHRAG_TIMEOUT_SECONDS`.

        Follow-ups: `history` carries up to 3 earlier questions of the same
        conversation (oldest first), each with up to 10 entity ids it was
        about. The client keeps the conversation; nothing is stored. The ids
        are checked against this graph again (ids that are not in it are
        ignored with a warning), the model may refer to them as `H1`, `H2`, …,
        and evidence is always retrieved afresh: an earlier answer is never
        evidence.

        What the model receives: the question, the ontology, the selected
        entities' types and bounded properties, for a follow-up the earlier
        questions and their entities' types and bounded properties, and the
        bounded evidence context (references, types and properties; no
        MindGraph ids).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskRequest" }
            examples:
              scoped:
                value:
                  question: Who else shares this device?
                  scope:
                    mode: selected_entities
                    entity_ids: [0190f0c1-7a2b-7c3d-8e4f-5a6b7c8d9e0f]
              follow_up:
                value:
                  question: Is there a path between them?
                  history:
                    - question: Which customers share Device DEVICE-921?
                      entity_ids:
                        - 0190f0c1-7a2b-7c3d-8e4f-5a6b7c8d9e0f
                        - 0190f0c1-7a2b-7c3d-8e4f-5a6b7c8d9e10
      responses:
        "200":
          description: |
            The answer, its evidence and checked citations. `status` is
            `answered`, `partial` (a retrieval limit was reached; results may
            be missing) or `insufficient_evidence`.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskResponse" }
        "400":
          description: "`INVALID_QUESTION`, `INVALID_SCOPE`, `INVALID_HISTORY`, `INVALID_JSON` or `INVALID_GRAPH_ID`."
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`GRAPH_NOT_FOUND`, or `ENTITY_NOT_FOUND` for a selected entity that is not in the graph."
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422":
          description: "`INVALID_RETRIEVAL_PLAN` or `RETRIEVAL_LIMIT_EXCEEDED`: the model's plan does not fit the graph or the limits."
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`AI_INVALID_RESPONSE`: the model did not return a valid answer."
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`AI_NOT_CONFIGURED`, `AI_UNAVAILABLE` or `SERVICE_UNAVAILABLE`."
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: "`AI_TIMEOUT`: the provider or the whole question exceeded its deadline."
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/graphrag/status:
    get:
      tags: [graphrag]
      operationId: getGraphRagStatus
      summary: Whether Ask MindGraph can answer questions now
      description: Always `200`. Never contains URLs or credentials. Graph exploration never depends on it.
      responses:
        "200":
          description: The GraphRAG status.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphBuilderStatus" }
  /api/v1/graph-builder/status:
    get:
      tags: [graph-builder]
      operationId: getGraphBuilderStatus
      summary: Whether AI suggestions can be requested now
      description: Always `200`. Never contains URLs or credentials. Manual flows never depend on it.
      responses:
        "200":
          description: The AI Graph Builder status.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphBuilderStatus" }
  /api/v1/jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      operationId: getJob
      summary: Read a job
      responses:
        "200":
          description: The job.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/jobs/{job_id}/events:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      operationId: streamJobEvents
      summary: Follow a job with Server-Sent Events
      description: |
        Emits `event: progress` while the job is queued or running, whenever
        its status or progress changes (persisted state is polled every
        500 ms), then one terminal `event: completed`, `failed` or
        `cancelled` and closes the stream. Every `data:` line is a `Job` as
        JSON. Comment keep-alives are sent every 15 s. If job state cannot be
        read, an `event: error` is sent and the stream closes. An unknown job
        is a normal `404` before the stream starts.
      responses:
        "200":
          description: An event stream.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event: progress
                data: {"id":"0190…","status":"running","progress":0.42,…}

                event: completed
                data: {"id":"0190…","status":"completed","progress":1.0,…}
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  parameters:
    GraphId:
      name: graph_id
      in: path
      required: true
      description: A MindGraph graph id (UUIDv7). Anything else is `400 INVALID_GRAPH_ID`.
      schema: { type: string, format: uuid }
    DataSourceId:
      name: data_source_id
      in: path
      required: true
      description: A data source id (UUIDv7). Anything else is `400 INVALID_DATA_SOURCE_ID`.
      schema: { type: string, format: uuid }
    EntityId:
      name: entity_id
      in: path
      required: true
      description: An entity id (UUIDv7). Anything else is `400 INVALID_ENTITY_ID`.
      schema: { type: string, format: uuid }
    JobId:
      name: job_id
      in: path
      required: true
      description: A job id (UUIDv7). Anything else is `400 INVALID_JOB_ID`.
      schema: { type: string, format: uuid }
  headers:
    RequestId:
      description: The request id, echoed from the request or generated (UUIDv7).
      schema: { type: string }
  responses:
    Error:
      description: |
        Error envelope. Codes: `INVALID_JSON`, `INVALID_QUERY`, `INVALID_REQUEST`,
        `INVALID_GRAPH_ID`, `INVALID_DATA_SOURCE_ID`, `INVALID_JOB_ID`,
        `INVALID_ENTITY_ID`,
        `MISSING_IDEMPOTENCY_KEY`, `INVALID_IDEMPOTENCY_KEY`, `MISSING_FILE`,
        `MISSING_FILENAME`, `INVALID_MULTIPART` (400), `GRAPH_NOT_FOUND`,
        `DATA_SOURCE_NOT_FOUND`, `JOB_NOT_FOUND`, `ENTITY_NOT_FOUND`,
        `ROUTE_NOT_FOUND` (404),
        `METHOD_NOT_ALLOWED` (405), `CONFLICT` (409), `PAYLOAD_TOO_LARGE` (413),
        `UNSUPPORTED_MEDIA_TYPE`, `UNSUPPORTED_FILE_TYPE` (415),
        `INVALID_QUESTION`, `INVALID_SCOPE`, `INVALID_HISTORY` (400, M7),
        `VALIDATION_FAILED`, `INVALID_MAPPING`, `INVALID_RETRIEVAL_PLAN`,
        `RETRIEVAL_LIMIT_EXCEEDED` (422), `INTERNAL_ERROR` (500),
        `AI_INVALID_RESPONSE` (502),
        `SERVICE_UNAVAILABLE`, `AI_NOT_CONFIGURED`, `AI_UNAVAILABLE`,
        `NOT_READY` (503), `AI_TIMEOUT` (504). Messages never contain
        dataset values, filesystem paths, prompts or provider details.
      headers:
        x-request-id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: GRAPH_NOT_FOUND
              message: Graph was not found
              request_id: 0190f0c1-7a2b-7c3d-8e4f-5a6b7c8d9e0f
  schemas:
    Health:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string, const: ok }
        service: { type: string, example: mindgraph-core }
        version: { type: string, example: 0.1.0 }
    CreateGraphRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Trimmed; 1–120 characters after trimming.
        description:
          type: [string, "null"]
          description: Optional, at most 2,000 characters. Blank text is stored as null.
    Graph:
      type: object
      required: [id, workspace_id, name, description, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        status: { type: string, enum: [draft, active, archived] }
        created_at: { type: string, format: date-time, description: RFC 3339, UTC, microseconds }
        updated_at: { type: string, format: date-time }
    GraphList:
      type: object
      required: [data, count]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Graph" }
        count: { type: integer, minimum: 0 }
    Property:
      type: object
      required: [key, type, required]
      properties:
        key: { type: string }
        type: { type: string, enum: [string, integer, float, boolean, datetime, string_array] }
        required: { type: boolean }
    EntityType:
      type: object
      required: [id, name, display_name, description, properties]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        display_name: { type: string }
        description: { type: [string, "null"] }
        properties:
          type: array
          items: { $ref: "#/components/schemas/Property" }
    RelationshipType:
      type: object
      required: [id, name, source_entity_type, target_entity_type, properties]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        source_entity_type: { type: string }
        target_entity_type: { type: string }
        properties:
          type: array
          items: { $ref: "#/components/schemas/Property" }
    Ontology:
      type: object
      required: [graph_id, version, entity_types, relationship_types]
      properties:
        graph_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        entity_types:
          type: array
          items: { $ref: "#/components/schemas/EntityType" }
        relationship_types:
          type: array
          items: { $ref: "#/components/schemas/RelationshipType" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
    PropertyType:
      type: string
      enum: [string, integer, float, boolean, datetime, string_array]
    PropertyDefinition:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { type: string, description: "Property key (`key` is accepted as an alias)." }
        type: { $ref: "#/components/schemas/PropertyType" }
        required: { type: boolean, default: false }
    EntityTypeDefinition:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, example: Customer }
        display_name: { type: [string, "null"], description: Defaults to `name`. }
        description: { type: [string, "null"] }
        properties:
          type: array
          default: []
          items: { $ref: "#/components/schemas/PropertyDefinition" }
    RelationshipTypeDefinition:
      type: object
      required: [name, source_entity_type, target_entity_type]
      additionalProperties: false
      properties:
        name: { type: string, example: OWNS }
        source_entity_type: { type: string, example: Customer }
        target_entity_type: { type: string, example: Account }
        properties:
          type: array
          default: []
          items: { $ref: "#/components/schemas/PropertyDefinition" }
    SuggestionRequest:
      type: object
      required: [data_source_ids]
      additionalProperties: false
      properties:
        data_source_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }
    CreateOntologyRequest:
      type: object
      required: [entity_types]
      additionalProperties: false
      properties:
        expected_version:
          type: integer
          minimum: 1
          description: |
            Optional precondition: the active version this body was based on.
            A different active version is a `409 CONFLICT`.
        entity_types:
          type: array
          items: { $ref: "#/components/schemas/EntityTypeDefinition" }
        relationship_types:
          type: array
          default: []
          items: { $ref: "#/components/schemas/RelationshipTypeDefinition" }
    FieldProfile:
      type: object
      required: [name, inferred_type, nullable, non_null_count, sample_values]
      properties:
        name: { type: string }
        inferred_type:
          $ref: "#/components/schemas/PropertyType"
          description: |
            Conservative inference. CSV numbers with a leading zero (`00123`)
            stay strings; JSON strings are never re-read as numbers; mixed
            integer/float widens to float; any other mix, or no value at all,
            is string.
        nullable: { type: boolean }
        non_null_count: { type: integer, minimum: 0 }
        sample_values:
          type: array
          maxItems: 5
          description: Up to 5 distinct values, each at most 200 characters.
          items: { type: string }
    DatasetProfile:
      type: object
      required: [record_count, fields, sample_rows]
      properties:
        record_count: { type: integer, minimum: 0 }
        fields:
          type: array
          description: CSV header order, or field names sorted for JSON.
          items: { $ref: "#/components/schemas/FieldProfile" }
        sample_rows:
          type: array
          maxItems: 20
          description: Up to 20 leading records (long strings truncated) for previews.
          items: { type: object, additionalProperties: true }
    DataSource:
      type: object
      required: [id, graph_id, kind, filename, status, size_bytes, content_sha256, profile, created_at, updated_at]
      description: Never contains storage paths or keys.
      properties:
        id: { type: string, format: uuid }
        graph_id: { type: string, format: uuid }
        kind: { type: string, enum: [csv, json] }
        filename: { type: string, description: The original filename (metadata only). }
        status: { type: string, enum: [pending, ready, failed] }
        size_bytes: { type: integer, minimum: 0 }
        content_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        profile:
          oneOf:
            - { $ref: "#/components/schemas/DatasetProfile" }
            - { type: "null" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FieldMapping:
      type: object
      required: [source_field, property]
      additionalProperties: false
      properties:
        source_field: { type: string, description: A field of the dataset profile. }
        property: { type: string, description: A property of the ontology type. }
    EntityMapping:
      type: object
      required: [alias, entity_type, identity]
      additionalProperties: false
      properties:
        alias: { type: string, description: Unique within the mapping; used by relationships. }
        entity_type: { type: string }
        mode:
          type: string
          enum: [create_or_match, match_only]
          default: create_or_match
          description: |
            Exact identity matching only. `create_or_match` reuses the single
            existing entity with the identity, or creates it; `match_only`
            requires it to exist. More than one match fails as ambiguous.
        identity:
          type: array
          minItems: 1
          description: For `create_or_match`, identity properties must also be mapped in `properties`.
          items: { $ref: "#/components/schemas/FieldMapping" }
        properties:
          type: array
          default: []
          description: Required for `create_or_match` (every required property mapped); must be empty for `match_only`.
          items: { $ref: "#/components/schemas/FieldMapping" }
    RelationshipMapping:
      type: object
      required: [relationship_type, source, target]
      additionalProperties: false
      properties:
        relationship_type: { type: string }
        source: { type: string, description: Alias whose type is the relationship source type. }
        target: { type: string, description: Alias whose type is the relationship target type. }
        properties:
          type: array
          default: []
          items: { $ref: "#/components/schemas/FieldMapping" }
    IngestionMapping:
      type: object
      required: [entities]
      additionalProperties: false
      properties:
        entities:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/EntityMapping" }
        relationships:
          type: array
          default: []
          items: { $ref: "#/components/schemas/RelationshipMapping" }
    IngestionRequest:
      type: object
      required: [mapping]
      additionalProperties: false
      properties:
        mapping: { $ref: "#/components/schemas/IngestionMapping" }
      example:
        mapping:
          entities:
            - alias: customer
              entity_type: Customer
              mode: create_or_match
              identity: [{ source_field: customer_id, property: customer_id }]
              properties:
                - { source_field: customer_id, property: customer_id }
                - { source_field: name, property: name }
          relationships: []
    IngestionSummary:
      type: object
      required: [records_processed, entities_created, entities_matched, relationships_created]
      description: Counters only; never record contents.
      properties:
        records_processed: { type: integer, minimum: 0 }
        entities_created: { type: integer, minimum: 0 }
        entities_matched: { type: integer, minimum: 0, description: Distinct existing entities reused. }
        relationships_created: { type: integer, minimum: 0 }
    JobError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            For example `MALFORMED_DATASET`, `UNSUPPORTED_FORMAT`, `TYPE_CONVERSION`,
            `MISSING_FIELD`, `AMBIGUOUS_ENTITY`, `ENTITY_NOT_FOUND`, `LIMIT_EXCEEDED`,
            `GRAPH_UNAVAILABLE`, `GRAPH_STORE_ERROR`, `PROCESS_RESTARTED`.
        message: { type: string, description: Names records (1-based) and fields, never values. }
    Job:
      type: object
      required: [id, graph_id, data_source_id, kind, status, progress, ontology_version, error, result, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        graph_id: { type: string, format: uuid }
        data_source_id:
          type: string
          format: uuid
          description: The data source the job reads; for an AI suggestion over several, the first.
        data_source_ids:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: uuid }
          description: Every data source the job reads, in the client's order.
        kind: { type: string, enum: [analyze, ingest, ai_suggest] }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        progress: { type: number, minimum: 0, maximum: 1, description: Never decreases; 1 when completed. }
        ontology_version:
          type: [integer, "null"]
          minimum: 1
          description: |
            The pinned ontology version: the version an ingestion was
            validated against, or the base of an AI suggestion; null for
            analysis.
        error:
          oneOf:
            - { $ref: "#/components/schemas/JobError" }
            - { type: "null" }
        result:
          description: |
            By job kind: `ingest` → `IngestionSummary`, `ai_suggest` →
            `GraphBuilderResult`, `analyze` → null (the profile is stored on the
            data source). Null until the job completes.
          oneOf:
            - { $ref: "#/components/schemas/IngestionSummary" }
            - { $ref: "#/components/schemas/GraphBuilderResult" }
            - { type: "null" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    JobAccepted:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued] }
    TypeAnnotation:
      type: object
      required: [name, confidence, reason, existing]
      properties:
        name: { type: string, description: An entity or relationship type name. }
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: The model's own confidence estimate; not a statistical guarantee.
        reason: { type: string, maxLength: 300 }
        existing: { type: boolean, description: Set by MindGraph from the base ontology, not by the model. }
    DatasetMapping:
      type: object
      required: [dataset, data_source_id, mapping]
      properties:
        dataset:
          type: string
          description: The dataset's label in the AI request (its filename, made unique with ` (n)`).
        data_source_id: { type: string, format: uuid }
        mapping:
          $ref: "#/components/schemas/IngestionMapping"
          description: An unchanged M4 ingestion mapping, valid against this dataset's profile.
    GraphBuilderSuggestion:
      type: object
      required: [ontology, mappings, confidence, annotations, warnings]
      properties:
        ontology:
          $ref: "#/components/schemas/CreateOntologyRequest"
          description: |
            The complete proposed next ontology version, in the same shape as
            `POST /api/v1/graphs/{graph_id}/ontology`. Existing types,
            property types, requiredness and relationship endpoints are kept;
            only new types and optional properties are added.
        mappings:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/DatasetMapping" }
          description: |
            One mapping per data source of the job, in a safe ingestion order:
            a data source that only matches (`match_only`) an entity type comes
            after the data sources that create it. Ingest them in this order,
            each with `POST .../data-sources/{data_source_id}/ingestions`.
        confidence: { type: number, minimum: 0, maximum: 1 }
        annotations:
          type: object
          required: [entities, relationships]
          properties:
            entities:
              type: array
              maxItems: 25
              items: { $ref: "#/components/schemas/TypeAnnotation" }
            relationships:
              type: array
              maxItems: 50
              items: { $ref: "#/components/schemas/TypeAnnotation" }
        warnings:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 300 }
    GraphBuilderResult:
      type: object
      required: [prompt_version, provider, model, ontology_version_base, repair_attempts, suggestion]
      description: The result of an `ai_suggest` job. Never the prompt, the raw provider response or any reasoning.
      properties:
        prompt_version: { type: string, example: graph_builder_v2 }
        provider: { type: string, example: openai_compatible }
        model: { type: string }
        ontology_version_base: { type: integer, minimum: 1 }
        repair_attempts: { type: integer, minimum: 0, maximum: 2 }
        suggestion: { $ref: "#/components/schemas/GraphBuilderSuggestion" }
    GraphBuilderStatus:
      type: object
      required: [status, configured]
      properties:
        status: { type: string, enum: [ready, not_configured, unavailable] }
        configured: { type: boolean }
        provider: { type: string }
        model: { type: string }
    PropertyValues:
      type: object
      description: |
        Property values as plain JSON: strings, numbers, booleans and string
        arrays. Datetimes are RFC 3339 strings; integers beyond 2^53 - 1 are
        decimal strings so no digit is lost. `property_types` says which is
        which.
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
            items: { type: string }
    PropertyTypes:
      type: object
      additionalProperties: { $ref: "#/components/schemas/PropertyType" }
    Entity:
      type: object
      required: [id, graph_id, entity_type, properties, property_types]
      properties:
        id: { type: string, format: uuid }
        graph_id: { type: string, format: uuid }
        entity_type: { type: string }
        properties: { $ref: "#/components/schemas/PropertyValues" }
        property_types: { $ref: "#/components/schemas/PropertyTypes" }
    Relationship:
      type: object
      required: [id, graph_id, relationship_type, source_id, target_id, properties, property_types]
      properties:
        id: { type: string, format: uuid }
        graph_id: { type: string, format: uuid }
        relationship_type: { type: string }
        source_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        properties: { $ref: "#/components/schemas/PropertyValues" }
        property_types: { $ref: "#/components/schemas/PropertyTypes" }
    Subgraph:
      type: object
      description: Entities and the relationships among them, ordered by id.
      required: [entities, relationships]
      properties:
        entities:
          type: array
          items: { $ref: "#/components/schemas/Entity" }
        relationships:
          type: array
          items: { $ref: "#/components/schemas/Relationship" }
    GraphPath:
      type: object
      description: |
        `entities` run from the source to the target; `relationships[i]`
        connects `entities[i]` and `entities[i + 1]` (in either direction).
        When `found` is false, `hops` is 0 and both arrays are empty.
      required: [found, hops, entities, relationships]
      properties:
        found: { type: boolean }
        hops: { type: integer, minimum: 0, maximum: 6 }
        entities:
          type: array
          items: { $ref: "#/components/schemas/Entity" }
        relationships:
          type: array
          items: { $ref: "#/components/schemas/Relationship" }
    EntitySearchRequest:
      type: object
      additionalProperties: false
      properties:
        entity_type:
          type: string
          description: Only entities of this type of the active ontology.
        property_filters:
          type: object
          maxProperties: 20
          description: Property key to exact value, typed by the active ontology.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: array
                items: { type: string }
        limit: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    EntitySearchResponse:
      type: object
      required: [data, count, limit]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Entity" }
        count:
          type: integer
          minimum: 0
          description: The number of entities returned (not a total).
        limit: { type: integer, minimum: 1, maximum: 1000 }
    PathRequest:
      type: object
      additionalProperties: false
      required: [source_id, target_id]
      properties:
        source_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        direction: { type: string, enum: [outgoing, incoming, both], default: both }
        max_depth: { type: integer, minimum: 1, maximum: 6, default: 3 }
    SubgraphRequest:
      type: object
      additionalProperties: false
      required: [entity_ids]
      properties:
        entity_ids:
          type: array
          maxItems: 1000
          items: { type: string, format: uuid }
    AskRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
        scope: { $ref: "#/components/schemas/AskScope" }
        history:
          type: array
          maxItems: 3
          description: Earlier questions of the conversation, oldest first (follow-ups).
          items: { $ref: "#/components/schemas/AskHistoryTurn" }
    AskHistoryTurn:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
        entity_ids:
          type: array
          maxItems: 10
          description: |
            Entities the earlier question was about or cited, most relevant
            first. At most 10 distinct entities of the whole history are used
            (newest question first).
          items: { type: string, format: uuid }
    AskScope:
      description: |
        `selected_entities` scopes the question to 1-5 entities of the graph
        (the most reliable mode). `bounded_graph` (the default) lets
        MindGraph discover candidates, inspecting at most 100.
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode, entity_ids]
          properties:
            mode: { const: selected_entities }
            entity_ids:
              type: array
              minItems: 1
              maxItems: 5
              items: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: { const: bounded_graph }
    EvidenceEntity:
      allOf:
        - { $ref: "#/components/schemas/Entity" }
        - type: object
          required: [ref]
          properties:
            ref: { type: string, pattern: "^E[1-9][0-9]*$" }
    EvidenceRelationship:
      allOf:
        - { $ref: "#/components/schemas/Relationship" }
        - type: object
          required: [ref]
          properties:
            ref: { type: string, pattern: "^R[1-9][0-9]*$" }
    EvidencePath:
      type: object
      required: [ref, entity_ids, relationship_ids]
      description: "`relationship_ids[i]` connects `entity_ids[i]` and `entity_ids[i + 1]`."
      properties:
        ref: { type: string, pattern: "^P[1-9][0-9]*$" }
        entity_ids:
          type: array
          items: { type: string, format: uuid }
        relationship_ids:
          type: array
          items: { type: string, format: uuid }
    Citation:
      type: object
      required: [ref, kind]
      properties:
        ref: { type: string }
        kind: { type: string, enum: [entity, relationship, path] }
        id:
          type: string
          format: uuid
          description: The cited entity or relationship; absent for paths.
    PlanSummary:
      type: object
      description: The validated retrieval plan, for display. Descriptive only, never executable.
      required: [operation]
      properties:
        operation:
          type: string
          enum: [entity_lookup, neighbors, find_path, shared_neighbor, unsupported]
        source: { type: string }
        target: { type: string }
        entity_type: { type: string }
        shared_entity_type: { type: string }
        relationship_type: { type: string }
        direction: { type: string, enum: [outgoing, incoming, both] }
        max_depth: { type: integer, minimum: 1, maximum: 6 }
        reason: { type: string, description: "The model's short explanation (untrusted text)." }
        notes:
          type: array
          items: { type: string }
    RetrievalReport:
      type: object
      required:
        [scope, plan, operations, candidates_inspected, truncated, context_bytes, limitations]
      properties:
        scope: { type: string, enum: [selected_entities, bounded_graph] }
        plan: { $ref: "#/components/schemas/PlanSummary" }
        operations: { type: integer, minimum: 0, maximum: 100 }
        candidates_inspected: { type: integer, minimum: 0 }
        truncated:
          type: boolean
          description: A limit stopped retrieval or reduced the context; the answer may miss results.
        context_bytes: { type: integer, minimum: 0, maximum: 49152 }
        limitations:
          type: array
          items: { type: string }
    AnswerMetadata:
      type: object
      required: [interpret_prompt_version, provider, model, conversation_turns, duration_ms]
      properties:
        interpret_prompt_version: { type: string, example: graphrag_interpret_v1 }
        synthesize_prompt_version:
          type: [string, "null"]
          example: graphrag_synthesize_v1
        provider: { type: string }
        model: { type: string }
        conversation_turns:
          type: integer
          minimum: 0
          maximum: 3
          description: Earlier questions used as conversation context.
        duration_ms: { type: integer, minimum: 0 }
    AskResponse:
      type: object
      required:
        [status, answer, answer_source, evidence, citations, warnings, retrieval, metadata]
      properties:
        status: { type: string, enum: [answered, partial, insufficient_evidence] }
        answer:
          type: string
          maxLength: 4001
          description: Model text with inline citations such as `[E1]`; unknown citations removed.
        answer_source:
          type: string
          enum: [model, no_evidence, unsupported]
          description: "`no_evidence` and `unsupported` answers are written by MindGraph, not by the model."
        evidence:
          type: object
          required: [entities, relationships, paths]
          properties:
            entities:
              type: array
              maxItems: 150
              items: { $ref: "#/components/schemas/EvidenceEntity" }
            relationships:
              type: array
              maxItems: 300
              items: { $ref: "#/components/schemas/EvidenceRelationship" }
            paths:
              type: array
              items: { $ref: "#/components/schemas/EvidencePath" }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        warnings:
          type: array
          items: { type: string }
        retrieval: { $ref: "#/components/schemas/RetrievalReport" }
        metadata: { $ref: "#/components/schemas/AnswerMetadata" }
