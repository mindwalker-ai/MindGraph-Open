name: CI

# Actions are pinned to commit SHAs (version in the comment); update them
# deliberately. Every job has read-only repository access.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      - name: Domain, core and entity-resolution crates stay infrastructure-free (ADR-002, ADR-009); MCP reaches Core only over REST (ADR-011)
        run: make check-domain-boundary check-core-boundary check-mcp-boundary check-resolution-boundary

  hugegraph-integration:
    name: HugeGraph 1.7 integration (live)
    runs-on: ubuntu-latest
    services:
      hugegraph:
        image: hugegraph/hugegraph:1.7.0
        env:
          # The same fixed heap as docker-compose.yml.
          JAVA_OPTS: -Xmx1g
        ports:
          - 18080:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Wait for HugeGraph
        # The server answers with an error page while it is still starting.
        run: curl -fsS --retry 60 --retry-all-errors --retry-delay 3 http://127.0.0.1:18080/versions
      - name: GraphStore contract against HugeGraph
        run: cargo test -p mindgraph-graph --test hugegraph_integration --locked -- --ignored
        env:
          MINDGRAPH_HUGEGRAPH_TEST_URL: http://127.0.0.1:18080
      - name: M4 dataset ingestion flow against HugeGraph (examples/fraud)
        run: cargo test -p mindgraph-api --test hugegraph_ingestion --locked -- --ignored
        env:
          MINDGRAPH_HUGEGRAPH_TEST_URL: http://127.0.0.1:18080
      - name: M8 MCP agent flow against HugeGraph (real binary over stdio)
        run: cargo test -p mindgraph-mcp --test end_to_end --locked -- --ignored --exact an_agent_finds_the_shared_device_over_mcp_on_hugegraph
        env:
          MINDGRAPH_HUGEGRAPH_TEST_URL: http://127.0.0.1:18080
      - name: M9 entity resolution flow against HugeGraph (graph left untouched)
        run: cargo test -p mindgraph-api --test hugegraph_resolution --locked -- --ignored
        env:
          MINDGRAPH_HUGEGRAPH_TEST_URL: http://127.0.0.1:18080

  postgres-integration:
    name: PostgreSQL 17 integration (live)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mindgraph
          POSTGRES_PASSWORD: mindgraph
          POSTGRES_DB: mindgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mindgraph -d mindgraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: MetadataStore contract and PostgreSQL tests (M3 + M4 migrations, fresh database per test)
        run: cargo test -p mindgraph-metadata --test postgres_integration --locked -- --ignored
        env:
          MINDGRAPH_POSTGRES_TEST_URL: postgres://mindgraph:mindgraph@127.0.0.1:5432/mindgraph

  web:
    name: Web (typecheck, lint, format, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Frontend tests
        run: npm test

  ai:
    name: AI service (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: services/ai
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pytest
        run: uv run pytest

  mcp-release:
    name: MCP release binary (build, protocol tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build mindgraph-mcp (release)
        run: cargo build -p mindgraph-mcp --release --locked
      - name: MCP protocol tests against the release binary (stdio, discovery, schemas, errors, EOF)
        run: cargo test -p mindgraph-mcp --release --locked --test mcp_protocol

  audit:
    name: Dependency audit (cargo-deny, npm, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Rust advisories, licenses, bans and sources (deny.toml)
        run: cargo deny check
      - name: Web production dependencies (npm audit)
        working-directory: apps/web
        run: npm audit --omit=dev
      - name: AI service runtime dependencies (pip-audit)
        working-directory: services/ai
        run: |
          uv export --no-dev --no-hashes --no-emit-project --frozen > "$RUNNER_TEMP/ai-requirements.txt"
          uv tool run --from pip-audit==2.9.0 pip-audit -r "$RUNNER_TEMP/ai-requirements.txt" --no-deps --disable-pip --progress-spinner off

  openapi:
    name: OpenAPI (valid, matches the router)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: make check-openapi

  full-stack:
    name: Full stack (Compose, demo, smoke, restart, browser journeys)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Playwright and Chromium
        working-directory: apps/web
        run: npm ci && npx playwright install --with-deps chromium
      # An isolated Compose project with its own volumes and ports: build,
      # load the fraud demo through the REST API, smoke-test the published
      # ports, re-run the loader (idempotent), restart with down + up (data
      # kept), run the Playwright journeys A-D, then remove only that project.
      - name: Isolated stack smoke test and browser journeys
        run: scripts/smoke-stack.sh --e2e
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  release-gate:
    name: Release gate (all checks passed)
    runs-on: ubuntu-latest
    needs: [rust, hugegraph-integration, postgres-integration, web, ai, mcp-release, audit, openapi, full-stack]
    steps:
      - run: echo "Every CI job passed."
