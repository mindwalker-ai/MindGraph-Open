name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      - name: Domain and core crates stay infrastructure-free (ADR-002)
        run: make check-domain-boundary check-core-boundary

  hugegraph-integration:
    name: HugeGraph 1.7 integration (live)
    runs-on: ubuntu-latest
    services:
      hugegraph:
        image: hugegraph/hugegraph:1.7.0
        ports:
          - 18080:8080
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Wait for HugeGraph
        # The server answers with an error page while it is still starting.
        run: curl -fsS --retry 60 --retry-all-errors --retry-delay 3 http://127.0.0.1:18080/versions
      - name: GraphStore contract against HugeGraph
        run: cargo test -p mindgraph-graph --test hugegraph_integration --locked -- --ignored
        env:
          MINDGRAPH_HUGEGRAPH_TEST_URL: http://127.0.0.1:18080

  postgres-integration:
    name: PostgreSQL 17 integration (live)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mindgraph
          POSTGRES_PASSWORD: mindgraph
          POSTGRES_DB: mindgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mindgraph -d mindgraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: MetadataStore contract and PostgreSQL tests (fresh database per test)
        run: cargo test -p mindgraph-metadata --test postgres_integration --locked -- --ignored
        env:
          MINDGRAPH_POSTGRES_TEST_URL: postgres://mindgraph:mindgraph@127.0.0.1:5432/mindgraph

  web:
    name: Web (typecheck, lint, format, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Frontend tests
        run: npm test

  ai:
    name: AI service (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes only full version tags (no floating `v10`).
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: services/ai
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pytest
        run: uv run pytest

  docker:
    name: Docker Compose (config, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
