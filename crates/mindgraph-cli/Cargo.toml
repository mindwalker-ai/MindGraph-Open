[package]
name = "mindgraph-cli"
description = "The `mindgraph` command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "mindgraph"
path = "src/main.rs"

[dependencies]
# `mindgraph mcp` launches the MCP server; its logic stays in mindgraph-mcp.
mindgraph-mcp.workspace = true
# `mindgraph demo` talks to Core over its public REST API only.
reqwest = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[lints]
workspace = true
