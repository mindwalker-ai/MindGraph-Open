[package]
name = "mindgraph-api"
description = "HTTP API of MindGraph Open and the `mindgraph-core` server binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The runtime process is called `mindgraph-core` (ADR-002). The binary lives
# here, in the outermost layer, so dependencies keep pointing inward:
# api -> core -> domain. This crate is also the composition root that wires
# the adapters into the application layer: PostgreSQL (mindgraph-metadata),
# HugeGraph (mindgraph-graph, `hugegraph` feature), local source storage
# (mindgraph-ingestion) and the internal AI service (mindgraph-ai-client).
[[bin]]
name = "mindgraph-core"
path = "src/main.rs"

[dependencies]
axum.workspace = true
chrono.workspace = true
futures-util.workspace = true
mindgraph-ai-client.workspace = true
mindgraph-core.workspace = true
mindgraph-domain.workspace = true
mindgraph-graph = { workspace = true, features = ["hugegraph"] }
mindgraph-graphrag.workspace = true
mindgraph-ingestion.workspace = true
mindgraph-metadata.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
tower.workspace = true

[lints]
workspace = true
