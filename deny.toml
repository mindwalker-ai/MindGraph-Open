# cargo-deny (M10): RustSec advisories, dependency licenses and sources.
#
#   cargo deny check
#
# Results and the reasoning behind each allowed license are recorded in
# docs/legal/LICENSE_AUDIT.md and docs/release/dependency-audit.md.

[graph]
all-features = false

[advisories]
# Unmaintained crates and yanked versions are reported for review.
yanked = "deny"
ignore = [
    # atomic-polyfill is unmaintained (no vulnerability). It reaches the
    # tree only through heapless 0.7 <- postcard, a build dependency of
    # phonenumber, and only on targets without atomic compare-and-swap; it is
    # not compiled for any platform MindGraph supports (`cargo tree -i
    # atomic-polyfill` prints nothing for the host target).
    { id = "RUSTSEC-2023-0089", reason = "unmaintained, not compiled on supported targets" },
]

[licenses]
# Licenses of third-party crates that are compatible with distributing
# MindGraph Open under AGPL-3.0-only (and mindgraph-mcp under Apache-2.0).
# A crate offering a choice (e.g. "MIT OR Apache-2.0") passes when any
# alternative is allowed. Anything else fails the check for human review.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# The workspace's own crates are unpublished (publish = false); their
# licenses are declared in their Cargo.toml and reviewed in LICENSE_AUDIT.md.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates refer to each other by path (`mindgraph-core.workspace = true`).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
